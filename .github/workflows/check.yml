name: Validar Threadly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Instalar dependências do app
        run: npm install --no-audit --no-fund

      - name: Typecheck, testes e build do app
        run: npm run check

      - name: Instalar dependências das Cloud Functions
        working-directory: firebase/functions
        run: npm install --no-audit --no-fund

      - name: Build das Cloud Functions
        working-directory: firebase/functions
        run: npm run build
